services:
  - type: web
    name: vera-ai-challenge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_POLISH
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
